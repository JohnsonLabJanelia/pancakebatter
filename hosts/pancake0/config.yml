# pancake configuration file example from pancake0
# Establishes versions of drivers, types of onboard hardware expected,
# etc...

schema:
  name: system_config
  version: 1

# System Information: OS, Kernel, ESDK, CUDA, FFmpeg, OpenCV, TensorRT, NVIDIA Driver, CUDA Capability
system_info:
  hostname: pancake0
  ubuntu_version: "22.04"
  kernel_version: 6.5.0-44-generic
  esdk_version: "2.55.02"
  cuda_version: "12.2.140"
  ffmpeg_version: "4.4.5"
  opencv_version: "4.10.0"
  tensorrt_version: "10.0.1.6"
  nvidia_driver_version: "610.57.04"
  cuda_capability: "sm_86"
  network_renderer: "NetworkManager"
  network_renderer_version: "2"
  network_manager_version: "1.36.6"
  cpu_model: "AMD Ryzen Threadripper PRO 5975WX 32-Cores"
  cpu_threads: 64
  memory_gb: 252
  board_vendor: "ASUSTeK COMPUTER INC."
  board_name: "Pro WS WRX80E-SAGE SE WIFI"
  bios_version: "1201"

# Power Distribution Units (PDUs)
pdus:
  - name: pdu1
    ip_address: 192.168.20.177 # Default IP address for CyberPower PDU
    model_number: PDU41101
    serial_number: NLPPU7000643
    manufacturer: CyberPower
    firmware_version: 1.3.2.0
    current: 
      maximum_input_amps: 15 # Max input current rating in Amps
      maximum_output_amps: 15 # Max output current rating in Amps
    phase: single
    voltage:
      minimum_voltage: 100 # Voltage minimum
      maximum_voltage: 120 # Voltage maximum
    frequency_range:
      minimum: 50 # in Hz
      maximum: 60 
    input_receptacles:
      type: NEMA L5-15P
      count: 1
    output_receptacles:
      type: NEMA 5-15R
      count: 8
    outlets:
      1:
       name: E0-55-97-1E-AB-F0 # Cam MAC address
       description: "Camera 4 (SN: 2010096)"
      2:
        name: E0-55-97-1E-AB-EF
        description: "Camera 3 (SN: 2010095)"
      3:
        name: E0-55-97-1E-AB-EE
        description: "Camera 2 (SN: 2010094)"
      4:
        name: E0-55-97-1E-AB-ED
        description: "Camera 1 (SN: 2010093)"
      5:
        name: null
        description: null
      6:
        name: null
        description: null
      7:
        name: null
        description: null
      8:
        name: null
        description: null
    

# Storage Devices
storage_devices:
  - name: nvme0n1
    model: Sabrent SB-RKT4P-8TB
    serial_number: 48816072200219
    capacity: 8  # in TB
    device_path: /dev/nvme0n1
    firmware_version: R4PTLC.4
    format: 512  # Block size in bytes
    sequential_read_speed: 7000  # MB/s
    sequential_write_speed: 6000  # MB/s
    partitions:
      - partition: nvme0n1p1
        fs_type: vfat
        mount_point: /boot/efi
      - partition: nvme0n1p2
        fs_type: ext4
        mount_point: /mnt/Data2

  - name: nvme1n1
    model: Sabrent SB-RKT4P-8TB
    serial_number: 48816072200222
    capacity: 8
    device_path: /dev/nvme1n1
    firmware_version: R4PTLC.4
    format: 512
    sequential_read_speed: 7000
    sequential_write_speed: 6000
    partitions:
      - partition: nvme1n1p1
        fs_type: vfat
        mount_point: /boot/efi
      - partition: nvme1n1p2
        fs_type: ext4
        mount_point: /var/snap/firefox/common/host-hunspell

  - name: nvme2n1
    model: Sabrent SB-RKT4P-8TB
    serial_number: 48804572201297
    capacity: 8
    device_path: /dev/nvme2n1
    firmware_version: R4PTLC.3
    format: 512
    sequential_read_speed: 7000
    sequential_write_speed: 6000
    partitions:
      - partition: nvme2n1p1
        fs_type: ext4
        mount_point: /mnt/Data1


