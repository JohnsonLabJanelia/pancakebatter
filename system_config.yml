# pancake0 configuration file
# Establishes versions of drivers, types of onboard hardware expected,
# etc... (Fill in later)

# System Information: OS and Kernel
system_info:
  ubuntu_version: "22.04"
  kernel_version: "5.19.0-32-generic"
  esdk_version: "1.0"

# GPUs
gpus:
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA RTX A6000
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06
  - model: NVIDIA A16
    driver_version: 535.183.06

# NIC(s)
emergent_nic:
  - model: PH-25-QUAD
    serial_number: 2008636
    firmware_version: 3.02
    pcie_id: 0000:41:00.0
    mac_address: E0-55-97-1E-AB-ED
    # Ports listed here are top to bottom
    # on the machine with nicknames for each
    # camera connected to the port
    - camera4_25Gb:
      mac_address: e0:55:97:1e:a6:3f
      mtu: 1024
      ip_address: 192.168.140.0
      transceiver:
        brand: Emergent
        model: RX03-0009A
        serial_number: 2206090381
        speed: 25Gb
        wavelength: 1310
        max_distance: 10
        fiber_type: SMF
    - camera3_25Gb:
      mac_address: e0:55:97:1e:a6:3d
      mtu: 1024
      ip_address: 192.168.130.0
      transceiver:
        brand: InnoLight
        model: TR-PY13L-V00
        serial_number: INLBS0450088
        speed: 25
        wavelength: 1310
        max_distance: 10
        fiber_type: SMF
    - camera2_25Gb:
      mac_address: e0:55:97:1e:a6:3c
      mtu: 1024
      ip_address: 192.168.120.0
      transceiver:
        brand: InnoLight
        model: TR-PY13L-V00
        serial_number: INLBS0450179
        speed: 25
        wavelength: 1310
        max_distance: 10
        fiber_type: SMF
    - camera1_25Gb:
      mac_address: e0:55:97:1e:a6:3e
      mtu: 1024
      ip_address: 192.168.110.0
      transceiver:
        brand: InnoLight
        model: TR-PY13L-V00
        serial_number: INLBO0680127
        speed: 25
        wavelength: 1310
        max_distance: 10
        fiber_type: SMF

# Cameras: Primary key is MAC address of machine
cameras:
