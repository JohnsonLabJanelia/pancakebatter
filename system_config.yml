      wavelength: 1310
      max_distance: 10
      fiber_type: SMF
    sensor:
      brand: Sony Pregius S
      model: IMX530
      mp_resolution: 20.28
      x_resolution: 4504
      y_resolution: 4504
      cell_size: 2.74
      sensor_type: CMOS
      sensor_size: 1.1
      shutter: Global
      max_exposure: 1
      min_exposure: 0.000005
