# pancake0 configuration file
# Establishes versions of drivers, types of onboard hardware expected,
# etc...

# System Information: OS, Kernel, ESDK, CUDA, FFmpeg, OpenCV, TensorRT, NVIDIA Driver, CUDA Capability
system_info:
  hostname: pancake0
  ubuntu_version: "22.04"
  kernel_version: 6.5.0-44-generic
  esdk_version: "1.0"
  cuda_version: "12.2.140"
  ffmpeg_version: "4.4"
  opencv_version: "4.8.0"
  tensorrt_version: "10.0.1.6"
  nvidia_driver_version: "535.183.06"
  cuda_capability: "sm_86"
  network_renderer: "NetworkManager"
  network_renderer_version: "2"

# Storage Devices
storage_devices:
  - nvme0n1: Sabrent SB-RKT4P-8TB
    serial_number: 48816072200219
    capacity: 8 # in TB
    device_path: /dev/nvme0n1
    firmware_version: R4PTLC.4
    format: 512 # Block size in bytes
    sequential_read_speed: 7000 # in MB/s
    sequential_write_speed: 6000 # in MB/s
  - nvme1n1: Sabrent SB-RKT4P-8TB
    serial_number: 48816072200222
    capacity: 8
    device_path: /dev/nvme1n1
    firmware_version: R4PTLC.4
    format: 512
    sequential_read_speed: 7000 MB/s
    sequential_write_speed: 6000 MB/s
  - nvme2n1: Sabrent SB-RKT4P-8TB
    serial_number: 48804572201297
    capacity: 8
    device_path: /dev/nvme2n1
    firmware_version: R4PTLC.3
    format: 512
    sequential_read_speed: 7000
    sequential_write_speed: 6000

