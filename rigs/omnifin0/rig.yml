# omnifin0: declared physical/optical layout (rig_config v1; rules in rigs/README.md).
# Host inventory (NIC, IP, lens, sensor, transceiver) is NOT here: cameras join to
# hosts/<host>/config.yml by serial_number only, and the host's `rigs:` block says which
# display output drives which projection path.
#
# Changing any physical field (see rigs/README.md) needs rig_geometry_revision + 1 and a new
# rigs/omnifin0/revisions.json entry; `python3 rigconfig.py rigs/omnifin0/rig.yml` prints the
# derived values to copy in and the digest to record.

schema:
  name: rig_config
  version: 1

rig_id: omnifin0
# 1-3 were Citrus's untracked targets/rigs/omnifin0/omnifin0_config.json (rig_config_v1);
# 4 is the first declaration here, so a pinned 3 still means Citrus's file.
rig_geometry_revision: 15
description: Four-arena projection rig on pancake0; one BenQ projector, four 20 MP cameras (HB-20000-SB).
last_physical_change: "2026-11-10"   # projector driven at 1920x1080@240 (rev 11); events.yml e4/e5

provenance:
  declared_by: pancakebatter session (draft for Jeremy's review)
  declared_at: "2026-10-12"
  note: >-
    Drafted from Citrus rig_config_v1 rev 3, Citrus calibration artifact names, and the
    HB-20000-SB GenICam XML captured 2026-07-24. Everything not backed by one of those is unknown.

projection_paths:
  main:
    projection_mode: rear
    projector_mount: unknown
    projector_mount_rotation_deg_about_optical_axis: 180
    projector_firmware_flip: vertical   # rev 10: BenQ Rear Ceiling (rear + 180 deg rotation) = one reflection
    optical_mirror_count: 0
    projector_settings:          # BenQ menu state; read it on the rig or over RS-232 (README)
      position_menu: rear_ceiling
      position_effective: rear_ceiling
      aspect_ratio: unknown
      upscaling_4k: "off"
      keystone_h: 0
      keystone_v: 0
      digital_zoom_percent: 100
      brightness: 50             # Picture menu (rev 9); changed from 11 on 2026-10-24, see events.yml
      contrast: 30
      sharpness: 5
      input_source: HDMI-1       # rev 11; the picture settings above are HDMI-1's (events.yml e4/e5)
      picture_mode: User
      gamma: "2.2"               # rev 13: colour and light settings, as found (RS-232 2026-11-12; OSD 2026-10-19)
      color_temperature: normal
      color_temperature_tuning: {r_gain: 100, g_gain: 100, b_gain: 100, r_offset: 256, g_offset: 256, b_offset: 256}
      color_management:          # not round values, never adjusted by Jeremy; origin unknown (evidence)
        red: {hue: 238, saturation: 196, gain: 220}
        green: {hue: 252, saturation: 208, gain: 173}
        blue: {hue: 138, saturation: 220, gain: 182}
        cyan: {hue: 235, saturation: 223, gain: 194}
        magenta: {hue: 259, saturation: 161, gain: 202}
        yellow: {hue: 135, saturation: 178, gain: 200}
      white_balance: {r_gain: 200, g_gain: 200, b_gain: 200}
      light_source_mode: normal
      hdmi_signal_format: auto
    projector_operation:         # rev 13; not physical: power-on, input and identity (README)
      qs02_media_streaming: "off"   # Jeremy turned it off 2026-11-12 (events.yml e9)
      quick_auto_search: "on"
      direct_power_on: "off"
      auto_power_off: unknown
      high_altitude: "off"
      hdmi_edid: enhanced        # HDMI-1; Standard would cap it at 1080p60 and change the EDID the host saves
      firmware: {system: "1.00", scaler: "1.04", mcu: "34.01-0.0.031"}
    display_mode:                # rev 11; Citrus refuses START when DP-2's live mode differs
      width_px: 1920
      height_px: 1080
      refresh_rate_hz: 240.0
    stimulus_render_rate_hz: 240 # rev 12; Citrus renders a new frame every refresh (was 120; events.yml e7)
    nominal_geometry:            # optional; consumed by nothing today (rev 9)
      lens_nadir_canvas_px: {x: 958, y: 1152}    # straight above the lens front glass, NOT the optical axis
      lens_nadir_uncertainty_px: {x: 12, y: 45}
      lens_glass_to_film_mm: 672
    evidence:
      note: >-
        Rotation 180 from Citrus rig_config_v1 rev 3 ("Projector body is rotated 180 degrees about
        its optical axis on this rig"). projection_mode rear (rev 5): the projector is below the
        diffusive gel film (the projected surface) and the fish and camera are above it, per the
        omnifin0/shadow media order in Citrus docs/rig_component_model_implementation_todo.md
        (projector -> cover -> air -> shelf -> water -> gel film -> water -> dish -> fish plane;
        citrus ec1134c) and the straight-down camera in docs/runtime_plane_and_parallax_decision.md.
        No fold mirror (rev 8): the projector shines straight up into the film, so
        optical_mirror_count 0 (Jeremy, 2026-10-19, relayed by photodiode-integrator). Jeremy never
        uses Digital Zoom or 4K Upscaling, so both are declared off (2026-10-18, same relay); confirm
        both once in the menu at commissioning.
        Projector Position and keystone (rev 10): the 2026-10-19 OSD record
        ~/SpecSail/runs/projector_settings_20261019/settings_as_found.json shows Installation >
        Projector Position "Rear Ceiling" (photo 08_installation.jpg, sha256
        9244b85a68939dcd428259c9c5d4ed5c6cb0c593fd6251231797ace5a2da2a4f) and 2D Keystone V 0, H 0
        (10_2d_keystone.jpg). Rear Ceiling maps to a vertical firmware flip by BenQ convention (the
        manual does not state it); either axis is one reflection, so the parity does not depend on it.
        An RS-232 *pp=?# readback would confirm it once there is a serial adapter. Mount (table vs
        ceiling) is still unknown and is a rotation only.
        Check: canvas_space_parity +1 and preserved camera handedness, composed with Citrus's
        presentation reflection (-1), predict det < 0 for camera_native_px -> final_display_canvas_px,
        which is what Citrus measured on all four omnifin0 cameras (joint derivation with citrus-agent,
        2026-10-27).
        Picture settings (rev 9): Brightness 50, Contrast 30, Sharpness 5. Jeremy changed Brightness
        from 11 to 50 with the remote between 2026-10-24T20:17:50Z and 22:04:44Z and kept it at 50;
        contrast and sharpness checked unchanged in the photo
        (~/SpecSail/runs/projector_settings_20261024/settings_change.json; dated event in events.yml).
        Colour, light and operation settings (rev 13, as found, nothing changed except QS02): read-only
        RS-232 on 2026-11-12 gave GAMMA 2.2, CT NORMAL, LAMPM LNOR, RGAIN/GGAIN/BGAIN 100, R/G/B OFFSET 256,
        WRGAIN/WGGAIN/WBGAIN 200, red primary HUE 238 SATURATION 196 GAIN 220 (PRIMCR RED), QAS ON,
        DIRECTPOWER OFF, HIGHALTITUDE OFF, firmware SYS 1.00 / SCALER 1.04 / MCU 34.01-0.0.031, all equal to the
        2026-10-19 OSD record (~/SpecSail/runs/projector_settings_20261019/settings_as_found.json). Green to
        yellow primaries, Signal Format Auto and EDID Enhanced for HDMI-1 have no RS-232 read and come from that
        record only; Jeremy has never adjusted colour on this projector. Auto Power Off was not recorded.
        QS02 Off: Jeremy, in the menu, 2026-11-12 (events.yml e9).
        Lens nadir (rev 9): specsail-calibration-protocol 2026-10-21, from tape (plumb 290 + spill shelf
        12.7 + 363 + shelf base 6.35 = 672 mm lens glass to film) plus CAD for the across-row placement.
        It is the film point directly above the lens front glass, not where the optical axis lands;
        do not use it as a principal point.
        Input, picture mode and display mode (rev 11): read-only RS-232 check 2026-11-10T15:32Z
        (SOUR=HDMI, APPMOD=USER1, BRI=50, CON=30, SHARP=5, PP=RC: confirms the picture settings and
        Rear Ceiling above; ~/SpecSail/runs/projector_settings_20261110/rs232_restore_check.txt). The
        projector keeps a picture mode per input: on HDMI-2 it showed RPG / Contrast 50 (events.yml
        e4). Display mode: Jeremy set DP-2 to 1920x1080 at 240 Hz on 2026-11-10 (xrandr: 594.000 MHz,
        2200 x 1125 total, 240.00 Hz; saved in GNOME monitors.xml). Earlier photometry was at 1080p
        ~120 Hz (rev 10 and before).
      declared_by: pancakebatter session (draft); rev 5 approved by Jeremy; rev 8 from Jeremy via photodiode-integrator; revs 9-10 approved by Jeremy; rev 11 display mode from Jeremy via citrus-agent
      declared_at: "2026-11-10"
    derived:
      canvas_space_parity: 1

cameras:
  "2010093":
    viewing_side: dorsal
    optical_mirror_count: 0
    reverse_x: not_supported_by_firmware
    reverse_y: not_supported_by_firmware
    rotation_deg: 0
    mount_notes: ""
    nominal_geometry:            # optional; parallax model only, consumed by nothing today
      height_above_gel_mm: unknown
      optical_axis_tilt_from_nadir_deg: unknown
    evidence: &camera_evidence
      note: >-
        reverse_x/y not_supported_by_firmware: the camera's GenICam XML (~/orange_data/calibrations/rig_characterization/
        sensor_pipeline/genicam_<serial>_20260724_235450.xml) has no ReverseX/ReverseY node, so the
        camera cannot flip. Viewing side and mirrors (rev 10): each camera is above the dish looking down
        (dorsal) with no mirror between dish and camera; Jeremy confirmed "No mirrors on any camera"
        2026-10-27 in the pancakebatter session. Orange saves the sensor raster with no software flip
        (Orange, 2026-10-27). Rotation 0: Orange's
        2026-10-13 answer on palette #377 says no software rotation is applied before recording, and
        Jeremy confirmed 2026-10-14 there is no rotation of the camera's view down to the fish. Camera->arena
        assignment is Citrus registered geometry and deliberately not here.
      declared_by: pancakebatter session (draft); rev 10 viewing side and mirrors from Jeremy
      declared_at: "2026-10-27"
    derived:
      recorded_space_parity: 1
      expected_camera_to_canvas_handedness:
        main: preserved
  "2010094":
    viewing_side: dorsal
    optical_mirror_count: 0
    reverse_x: not_supported_by_firmware
    reverse_y: not_supported_by_firmware
    rotation_deg: 0
    mount_notes: ""
    nominal_geometry:            # optional; parallax model only, consumed by nothing today
      height_above_gel_mm: unknown
      optical_axis_tilt_from_nadir_deg: unknown
    evidence: *camera_evidence
    derived:
      recorded_space_parity: 1
      expected_camera_to_canvas_handedness:
        main: preserved
  "2010095":
    viewing_side: dorsal
    optical_mirror_count: 0
    reverse_x: not_supported_by_firmware
    reverse_y: not_supported_by_firmware
    rotation_deg: 0
    mount_notes: ""
    nominal_geometry:            # optional; parallax model only, consumed by nothing today
      height_above_gel_mm: unknown
      optical_axis_tilt_from_nadir_deg: unknown
    evidence: *camera_evidence
    derived:
      recorded_space_parity: 1
      expected_camera_to_canvas_handedness:
        main: preserved
  "2010096":
    viewing_side: dorsal
    optical_mirror_count: 0
    reverse_x: not_supported_by_firmware
    reverse_y: not_supported_by_firmware
    rotation_deg: 0
    mount_notes: ""
    nominal_geometry:            # optional; parallax model only, consumed by nothing today
      height_above_gel_mm: unknown
      optical_axis_tilt_from_nadir_deg: unknown
    evidence: *camera_evidence
    derived:
      recorded_space_parity: 1
      expected_camera_to_canvas_handedness:
        main: preserved

# Optional (rev 9; rules in rigs/README.md "Room orientation"): canvas axes as seen by the operator
# standing at the door, looking at the rig from above.
room_orientation:
  canvas_minus_x: operator_left
  canvas_minus_y: toward_operator
  projector_offset_toward: canvas_plus_y
  evidence:
    note: >-
      Canvas -y is the door side, where the operator stands; the projector sits toward the back (+y):
      Jeremy confirmed 2026-10-27 (relayed by zebrafish-vision-teacher), first inferred from the
      2026-10-19 orientation photo. Canvas -x is the operator's left: Jeremy told rig-designer
      2026-10-27 "arena 1 is on my left from the door", so arena_1 is at the -x end.
    declared_by: Jeremy, via zebrafish-vision-teacher and rig-designer; rev 9 approved by Jeremy
    declared_at: "2026-10-27"

# Optional (rev 9; rules in rigs/README.md "Media stack"): the EXPERIMENT stack, light from the
# projector up to the fish. The power-meter sweeps used a different arrangement (sensor in air above
# the water, no dish); that geometry belongs with the SpecSail runs, not here.
media_stack:
  air_between_film_and_fish: false
  layers:
    - id: shelf
      medium: acrylic
      thickness_mm: 6.35
      refractive_index: 1.49
      refractive_index_source: >-
        typical cast PMMA (n_d), not stated by McMaster; shelf believed to be McMaster 8560K-series clear cast
        acrylic (Jeremy 2026-11-13, "as far as I know"); via rig-designer-bom 2026-11-14. Below the image
        plane, so it changes no eye_to_film value.
      evidence:
        note: >-
          The shared shelf's acrylic base (acrlyicBase in the edited imaging_cabinet_5 FCStd), one sheet
          under all four arenas. 6.35 mm is the CAD value, not calipered (Jeremy approved using it,
          2026-10-27). The gasket (1.59), machined aluminum tank holder (6.35) and vinyl (0.25-0.26) above
          it have 92 mm bores at the arenas, so arena light crosses only this acrylic (rig-designer).
        declared_by: rig-designer from CAD; approved by Jeremy
        declared_at: "2026-10-27"
    - id: water_under_film
      medium: water
      thickness_mm: 0
      refractive_index: 1.333
      refractive_index_source: pure water, visible, room temperature (textbook value)
      evidence:
        note: >-
          Declared, not measured: Jeremy presses the film flat onto the cup floor, so the water under it is
          about as thin as the film (calipers record 2026-11-13). It lies below the scattering surface, so
          it changes no distance to the fish.
        declared_by: Jeremy, via Orange and rig-designer
        declared_at: "2026-11-13"
    - id: film
      medium: film
      part_id: optic.fish_imaging.arena_diffuser_disc
      thickness_mm: 0.06
      refractive_index: unknown
      evidence:
        note: >-
          Rosco Cinegel 3026, calipered by Jeremy 2026-11-13: 0.06 mm, about +/-0.02 at caliper resolution.
          Below its fish-side face, so not counted in eye_to_film.
        declared_by: Jeremy (calipers), via Orange and rig-designer
        declared_at: "2026-11-13"
    - id: water_film_to_dish
      medium: water
      thickness_mm: unknown          # support.fill_layer: the dish floor (holder top minus the dish's seat) minus its base
      refractive_index: 1.333
      refractive_index_source: pure water, visible, room temperature (textbook value)
    - id: dish_base
      medium: acrylic
      thickness_mm: unknown          # a dish property: not the rig's
      refractive_index: unknown      # a dish property: not the rig's
      evidence:
        note: >-
          Slot only. Split adopted by Jeremy 2026-11-13: rig.yml holds what is at or below the image plane
          (shelf, film, holder) and the holder-top height (support); the dish's base thickness, index and
          seat-to-floor drop belong to the dish (hardware_library dish parts, PR #11; Citrus tank_designs
          until it merges); which dish is in which arena, the fill and the eye height belong to the session.
          As of 2026-11-14 (Jeremy, calipers; record 4934d7c): two dishes, bases 3 mm and 6 mm, each built as
          a base plus a 2.8 mm winglet layer that is also the wall above the floor, so the floor is flush
          with the holder top (seat-to-floor 0; the CAD's middle ring is not built). Water under the dish is
          then about 5.13 mm (3 mm base) and 2.13 mm (6 mm base). Acrylic n 1.49 unverified. Dish names
          are unresolved and kept out of this file.
        declared_by: pancakebatter session, per the split
        declared_at: "2026-11-14"
    - id: dish_water
      medium: water
      thickness_mm: unknown          # the session's fill: not the rig's
      refractive_index: 1.333
      refractive_index_source: pure water, visible, room temperature (textbook value)
      evidence:
        note: >-
          Slot only; the fill is a session value. As of 2026-11-14 (Jeremy): filled to the top of the
          2.8 mm winglet layer, about 14 mL, so about 2.8 mm deep (the earlier 3 mm / 15 mL was approximate).
        declared_by: pancakebatter session, per the split
        declared_at: "2026-11-14"
  arenas:
    arena_1: {}
    arena_2: {}
    arena_3: {}
    arena_4: {}
  support:
    holder_top_above_film_mm: 8.13
    fill_layer: water_film_to_dish
    evidence:
      note: >-
        Each dish hangs by its winglets on the top of the holder (the cup rim). 8.13 = cup depth 8.19 (shelf
        CAD: gasket 1.59 + aluminum tank holder 6.35 + vinyl 0.25, cup floor to holder top, not as-built)
        minus the film 0.06, with the water under the film taken as 0. Derived from CAD, not measured; about
        +/-0.3 (gasket compression, how level floor and rim are). The dish floor is this minus the dish's
        seat-to-floor drop (0 for both built dishes, 2026-11-14); Citrus derives it per arena at START as
        dish_floor_above_image_plane_mm. Rev 14 declared this same 8.13 as dish_floor_above_film_mm.
        To settle it: a depth gauge from the holder top to the film (the wet-minus-dry scale capture is
        circular without an independent camera height, per Orange, so it does not settle it).
        Record: phd-projects rigs/evidence/rig-odmz/20261113_omnifin0_imaging_stack.md (4934d7c).
      declared_by: rig-designer from Jeremy's sketch, calipers and the shelf CAD; via Orange
      declared_at: "2026-11-14"
  evidence:
    note: >-
      Order from Jeremy 2026-10-20, confirmed 2026-11-13: light -> acrylic shelf -> thin water -> film ->
      water-filled cup -> acrylic dish base -> fish water, no air between film and fish. The dish does not
      rest on the film; it hangs from the holder rim (support, holder_top_above_film_mm). Rig, dish and session split (Jeremy,
      2026-11-13): the layers above the film are slots whose values come from the dish and the session, so
      eye_to_film is not derivable from rig.yml alone (Citrus computes it at START). Film part from
      hardware_library 3383437. Records: phd-projects rigs/evidence/rig-odmz/20261113_omnifin0_imaging_stack.md
      and 20261113_dish_gel_calipers.md (commit f6f1089), with 20261113_stack_sketch_jeremy.png.
    declared_by: pancakebatter session from rig-designer's record of Jeremy's measurements and sketch
    declared_at: "2026-11-13"
  derived:
    arena_1: {eye_to_film_mm: unknown, eye_to_film_paraxial_mm: unknown}
    arena_2: {eye_to_film_mm: unknown, eye_to_film_paraxial_mm: unknown}
    arena_3: {eye_to_film_mm: unknown, eye_to_film_paraxial_mm: unknown}
    arena_4: {eye_to_film_mm: unknown, eye_to_film_paraxial_mm: unknown}
